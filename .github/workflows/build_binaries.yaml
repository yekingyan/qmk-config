name: Build Vial firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          submodules: recursive

      # 注意：这一步以前还有两道针对 vendored `serial_vendor.c` 的守卫
      # （上游漂移 sha256 校验 + VPATH 覆盖生效校验）。2026-08-11 撤掉了那个
      # 本地覆盖（它修的隐患真实但已证明不是「USB 失声」的原因，且恰好能被
      # dolphin5x.c 里的硬件看门狗兜住），所以两道守卫一并移除。
      # 详见 plan.md「已知坑」表里 serial_vendor.c 那几行。

      - name: Copy keyboard definitions and userspace into vial-qmk
        run: |
          set -euo pipefail
          # Dolphin52 / Dolphin54 键盘定义
          cp -r keyboards/dolphin52 vial-qmk/keyboards/dolphin52
          cp -r keyboards/dolphin54 vial-qmk/keyboards/dolphin54
          # users/vial 里放的是两个键盘共享的键盘级代码 dolphin5x.c
          # （硬件看门狗 + USB 失声三级自恢复 + 诊断计数器）。
          # 漏掉这一步会「编译成功但功能全丢」，所以下面有专门的守卫。
          mkdir -p vial-qmk/users
          cp -r users/vial vial-qmk/users/vial

      # 守卫 A：我们在 users/vial/dolphin5x.c 里覆盖了上游 weak 的
      # `is_keyboard_master_impl()`（Sticky master）。覆盖本身是被允许的，但它的
      # fallback 分支**复刻了上游 `usb_bus_detected()` 的逻辑** —— 因为那个函数是
      # static、`SPLIT_USB_TIMEOUT_POLL` 也只定义在 split_util.c 内部，拿不到。
      #
      # 于是上游一旦改了主从判定的语义（改成先读 VBUS、调整 usb_disconnect() 时机、
      # 把轮询挪走……），我们那份 fallback 会**静默地按旧语义工作**，编译照样成功。
      # 这里只校验我们真正依赖的那几个假设，不做整文件 sha256 ——
      # split_util.c 会因无关改动频繁变化，整文件哈希会天天误报。
      - name: Guard upstream split master-detection assumptions
        run: |
          set -uo pipefail
          F=vial-qmk/quantum/split_common/split_util.c
          fail=0
          check() { # check <描述> <grep 正则>
            if grep -Eq -- "$2" "$F"; then
              echo "  ✓ $1"
            else
              echo "::error::上游假设已失效: $1"
              echo "     期望匹配: $2"
              fail=1
            fi
          }
          echo "校验 $F 中我们依赖的假设："
          check "is_keyboard_master_impl 仍是 weak（我们才能覆盖它）" \
                '__attribute__\(\(weak\)\) bool is_keyboard_master_impl\(void\)'
          check "usb_bus_detected 仍按 SPLIT_USB_TIMEOUT / SPLIT_USB_TIMEOUT_POLL 轮询" \
                'for \(uint16_t i = 0; i < \(SPLIT_USB_TIMEOUT / SPLIT_USB_TIMEOUT_POLL\); i\+\+\)'
          check "usb_bus_detected 轮询的仍是 usb_connected_state()" \
                'if \(usb_connected_state\(\)\)'
          check "SPLIT_USB_TIMEOUT_POLL 默认值仍是 10（我们本地也用 10）" \
                'define SPLIT_USB_TIMEOUT_POLL 10'
          check "判定为从手时仍调 usb_disconnect()" \
                'usb_disconnect\(\);'
          check "is_keyboard_left_impl 默认分支仍是 return is_keyboard_master()（手别跟着主从走）" \
                'return is_keyboard_master\(\);'
          if [ "$fail" != "0" ]; then
            echo "----- split_util.c 中相关片段 -----"
            sed -n '30,60p;175,235p' "$F"
            echo "::error::请同步 users/vial/dolphin5x.c 里的 is_keyboard_master_impl()，"
            echo "::error::并复核 plan.md「新发现的风险 / Sticky master」一节的推理是否仍成立。"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: QMK setup
        run: |
          cd vial-qmk
          qmk setup --yes --home .

      - name: Build Dolphin52 and Dolphin54 firmware
        run: |
          set -euo pipefail
          cd vial-qmk
          make dolphin52:vial 2>&1 | tee build-dolphin52.log
          make dolphin54:vial 2>&1 | tee build-dolphin54.log

      # 守卫：确认共享的 users/vial/dolphin5x.c 真的被编进去了。
      #
      # 这是必需的，因为失效方式是**静默的**：QMK 的 userspace 机制只在
      # 「keymap 名 == 目录名」时才把 users/<name>/ 加入 VPATH 并 include
      # 它的 rules.mk。一旦这个机制变了、或 CI 忘了拷 users/ 目录，
      # 构建照样成功，只是硬件看门狗、USB 失声三级自恢复、诊断计数器
      # 全部悄悄消失 —— 而这些恰恰是本仓库现在最要紧的东西。
      - name: Verify shared users/vial/dolphin5x.c was compiled
        run: |
          set -euo pipefail
          cd vial-qmk
          for kb in dolphin52 dolphin54; do
            if ! grep -q "users/vial/dolphin5x.c" "build-${kb}.log"; then
              echo "::error::${kb}: users/vial/dolphin5x.c 没有被编译 —— 看门狗与 USB 失声自恢复已静默丢失！"
              grep -i "dolphin5x\|users/vial" "build-${kb}.log" || true
              exit 1
            fi
            echo "${kb}: users/vial/dolphin5x.c 已编入"
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-vial-firmware
          if-no-files-found: error
          path: |
            vial-qmk/*.uf2
