name: Build Vial firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: vial-qmk
          submodules: recursive

      # 注意：这一步以前还有两道针对 vendored `serial_vendor.c` 的守卫
      # （上游漂移 sha256 校验 + VPATH 覆盖生效校验）。2026-08-11 撤掉了那个
      # 本地覆盖（它修的隐患真实但已证明不是「USB 失声」的原因，且恰好能被
      # dolphin5x.c 里的硬件看门狗兜住），所以两道守卫一并移除。
      # 详见 plan.md「已知坑」表里 serial_vendor.c 那几行。

      - name: Copy keyboard definitions and userspace into vial-qmk
        run: |
          set -euo pipefail
          # Dolphin52 / Dolphin54 键盘定义
          cp -r keyboards/dolphin52 vial-qmk/keyboards/dolphin52
          cp -r keyboards/dolphin54 vial-qmk/keyboards/dolphin54
          # users/vial 里放的是两个键盘共享的键盘级代码 dolphin5x.c
          # （硬件看门狗 + USB 失声三级自恢复 + 诊断计数器）。
          # 漏掉这一步会「编译成功但功能全丢」，所以下面有专门的守卫。
          mkdir -p vial-qmk/users
          cp -r users/vial vial-qmk/users/vial

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: QMK setup
        run: |
          cd vial-qmk
          qmk setup --yes --home .

      - name: Build Dolphin52 and Dolphin54 firmware
        run: |
          set -euo pipefail
          cd vial-qmk
          make dolphin52:vial 2>&1 | tee build-dolphin52.log
          make dolphin54:vial 2>&1 | tee build-dolphin54.log

      # 守卫：确认共享的 users/vial/dolphin5x.c 真的被编进去了。
      #
      # 这是必需的，因为失效方式是**静默的**：QMK 的 userspace 机制只在
      # 「keymap 名 == 目录名」时才把 users/<name>/ 加入 VPATH 并 include
      # 它的 rules.mk。一旦这个机制变了、或 CI 忘了拷 users/ 目录，
      # 构建照样成功，只是硬件看门狗、USB 失声三级自恢复、诊断计数器
      # 全部悄悄消失 —— 而这些恰恰是本仓库现在最要紧的东西。
      - name: Verify shared users/vial/dolphin5x.c was compiled
        run: |
          set -euo pipefail
          cd vial-qmk
          for kb in dolphin52 dolphin54; do
            if ! grep -q "users/vial/dolphin5x.c" "build-${kb}.log"; then
              echo "::error::${kb}: users/vial/dolphin5x.c 没有被编译 —— 看门狗与 USB 失声自恢复已静默丢失！"
              grep -i "dolphin5x\|users/vial" "build-${kb}.log" || true
              exit 1
            fi
            echo "${kb}: users/vial/dolphin5x.c 已编入"
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-vial-firmware
          if-no-files-found: error
          path: |
            vial-qmk/*.uf2
